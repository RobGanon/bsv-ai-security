name: Publish to PyPI

# Publishes automatically when a GitHub release is published (tag v*).
# Uses PyPI trusted publishing (OIDC): no API token is stored anywhere.
# One-time PyPI setup (repo owner, on pypi.org): add a trusted publisher
# for this project with owner RobGanon, repository bsv-ai-security, and
# workflow file publish.yml. No environment is used.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
