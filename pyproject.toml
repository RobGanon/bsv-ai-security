[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sealrun"
version = "0.4.0"
description = "Local AI artifact verification and tamper-evident audit prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sealrun = "sealrun.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
